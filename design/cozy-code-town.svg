<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9d8ed"/>
      <stop offset="0.48" stop-color="#d8cee6"/>
      <stop offset="1" stop-color="#f6d7c8"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8994ad"/>
      <stop offset="1" stop-color="#5e687d"/>
    </linearGradient>
    <linearGradient id="wallWarm" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e7b8a7"/>
      <stop offset="1" stop-color="#bd93a4"/>
