    <radialGradient id="sunGlow">
      <stop stop-color="#fff3c7" stop-opacity=".9"/>
      <stop offset=".42" stop-color="#f8cc9d" stop-opacity=".35"/>
      <stop offset="1" stop-color="#f8cc9d" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray"><feFuncA type="table" tableValues="0 .055"/></feComponentTransfer>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#465165" flood-opacity=".28"/>
    </filter>
  </defs>

