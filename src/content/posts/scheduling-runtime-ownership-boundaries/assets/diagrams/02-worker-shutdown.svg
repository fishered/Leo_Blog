<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="320" viewBox="0 0 1040 320" role="img" aria-labelledby="title desc">
  <title id="title">Bounded worker shutdown</title>
  <desc id="desc">The coordinator closes reconcile admission, requests interruption, waits for up to five seconds, and runs the ownership release callback after termination or timeout.</desc>
  <rect width="1040" height="320" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" fill="#172033" text-anchor="middle">
    <rect x="30" y="82" width="190" height="88" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="125" y="118" font-size="17">Coordinator closes</text>
    <text x="125" y="144" font-size="17">reconcile admission</text>
    <rect x="270" y="82" width="170" height="88" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="355" y="121" font-size="18">shutdownNow()</text>
    <text x="355" y="146" font-size="15">request interruption</text>
    <rect x="490" y="82" width="170" height="88" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="575" y="119" font-size="18">await termination</text>
    <text x="575" y="146" font-size="17">up to 5 seconds</text>
    <rect x="710" y="82" width="170" height="88" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="795" y="119" font-size="18">release ownership</text>
    <text x="795" y="146" font-size="15">finally callback</text>
    <rect x="930" y="82" width="80" height="88" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="970" y="132" font-size="17">Offline</text>
    <text x="520" y="238" font-size="16" fill="#9a3412">If await times out, Firefly logs a warning and still runs the release callback.</text>
  </g>
  <g stroke="#334155" stroke-width="3" fill="none">
    <path d="M220 126h45"/>
    <path d="M440 126h45"/>
    <path d="M660 126h45"/>
    <path d="M880 126h45"/>
  </g>
  <g fill="#334155">
    <path d="M260 118l12 8-12 8z"/>
    <path d="M480 118l12 8-12 8z"/>
    <path d="M700 118l12 8-12 8z"/>
    <path d="M920 118l12 8-12 8z"/>
  </g>
</svg>
