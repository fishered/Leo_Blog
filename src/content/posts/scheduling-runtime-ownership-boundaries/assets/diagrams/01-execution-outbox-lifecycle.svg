<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="320" viewBox="0 0 1040 320" role="img" aria-labelledby="title desc">
  <title id="title">Execution and Outbox lifecycle ownership</title>
  <desc id="desc">Admin and maintenance callers enter one lifecycle service. A compatibility adapter or lifecycle store reaches one JDBC transaction that updates execution, targets, and dispatch outbox.</desc>
  <rect width="1040" height="320" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#172033" text-anchor="middle">
    <rect x="40" y="84" width="170" height="88" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="125" y="120" font-size="19">Admin /</text>
    <text x="125" y="146" font-size="19">Maintenance</text>
    <rect x="270" y="84" width="190" height="88" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="365" y="120" font-size="19">ExecutionLifecycle</text>
    <text x="365" y="146" font-size="19">Service</text>
    <rect x="520" y="84" width="190" height="88" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="615" y="120" font-size="19">Lifecycle Store</text>
    <text x="615" y="146" font-size="16">or repository adapter</text>
    <rect x="770" y="68" width="230" height="120" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="885" y="104" font-size="18">One JDBC transaction</text>
    <text x="885" y="134" font-size="17">Execution + Targets</text>
    <text x="885" y="160" font-size="17">Dispatch Outbox</text>
    <text x="520" y="246" font-size="16" fill="#475569">Compatibility remains at the adapter; atomicity lives in the JDBC repository transaction.</text>
  </g>
  <g stroke="#334155" stroke-width="3" fill="none">
    <path d="M210 128h55"/>
    <path d="M460 128h55"/>
    <path d="M710 128h55"/>
  </g>
  <g fill="#334155">
    <path d="M260 120l12 8-12 8z"/>
    <path d="M510 120l12 8-12 8z"/>
    <path d="M760 120l12 8-12 8z"/>
  </g>
</svg>
