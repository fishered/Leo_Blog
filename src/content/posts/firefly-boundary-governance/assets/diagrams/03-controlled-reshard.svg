<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Controlled Firefly shard expansion</title>
  <desc id="desc">Operators drain control-plane nodes, keep data-plane nodes online, run a locked transactional shard expansion, then restart control-plane nodes with the new count.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="60" y="60" font-family="Inter, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#111827">Controlled online shard expansion</text>
  <text x="60" y="92" font-family="Inter, Segoe UI, sans-serif" font-size="16" fill="#475569">Data plane stays online; shard-aware control plane stops before the mapping changes.</text>

  <text x="120" y="142" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#111827">Operator</text>
  <text x="390" y="142" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#8f2f22">Scheduler / API</text>
  <text x="680" y="142" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#116466">Gateway / Executor</text>
  <text x="1010" y="142" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#5b3d8d">JDBC</text>

  <line x1="120" y1="160" x2="120" y2="698" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="390" y1="160" x2="390" y2="698" stroke="#dc5a47" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="680" y1="160" x2="680" y2="698" stroke="#168a8a" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="1010" y1="160" x2="1010" y2="698" stroke="#7c5bb7" stroke-width="2" stroke-dasharray="6 6"/>

  <rect x="68" y="180" width="104" height="42" rx="5" fill="#ffffff" stroke="#64748b"/>
  <text x="120" y="206" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#334155">backup DB</text>
  <path d="M172 201 L985 201" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M145 270 L365 270" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255" y="254" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#334155">drain + stop</text>
  <rect x="340" y="286" width="100" height="42" rx="5" fill="#fef2f2" stroke="#dc5a47"/>
  <text x="390" y="312" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#991b1b">OFFLINE</text>

  <rect x="620" y="250" width="120" height="78" rx="5" fill="#e8fbf9" stroke="#168a8a"/>
  <text x="680" y="280" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#116466">ONLINE</text>
  <text x="680" y="306" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#334155">connections stay</text>

  <path d="M145 380 L985 380" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="362" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#334155">expand-online + explicit confirmation + target shard count</text>

  <rect x="884" y="404" width="252" height="174" rx="6" fill="#f5f1fb" stroke="#7c5bb7" stroke-width="2"/>
  <text x="1010" y="438" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#5b3d8d">ONE TRANSACTION</text>
  <text x="910" y="472" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#334155">1. migration lock</text>
  <text x="910" y="500" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#334155">2. verify idle state</text>
  <text x="910" y="528" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#334155">3. recompute job shards</text>
  <text x="910" y="556" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#334155">4. revision + lease cleanup</text>

  <path d="M985 608 L145 608" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="592" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#166534">commit: actual shard count = target</text>

  <path d="M145 660 L365 660" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255" y="644" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#334155">restart with target</text>
  <rect x="340" y="674" width="100" height="42" rx="5" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="390" y="700" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#166534">REJOIN</text>

  <rect x="530" y="674" width="300" height="42" rx="5" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="680" y="700" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#92400e">No online contraction / no dual routing</text>
</svg>
