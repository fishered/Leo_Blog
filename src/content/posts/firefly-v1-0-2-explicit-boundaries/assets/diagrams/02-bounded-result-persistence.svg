<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Bounded result persistence</title>
  <desc id="desc">Netty EventLoop submits persistence work to a bounded worker and bounded delayed retry path with explicit accepted, retrying, and rejected outcomes.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="60" y="62" font-family="Inter, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#111827">Bounded result persistence</text>
  <text x="60" y="94" font-family="Inter, Segoe UI, sans-serif" font-size="16" fill="#475569">Transient saturation is delayed off the EventLoop; every path remains finite.</text>

  <rect x="60" y="180" width="190" height="104" rx="6" fill="#ffffff" stroke="#168a8a" stroke-width="2"/>
  <text x="155" y="220" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#116466">Netty EventLoop</text>
  <text x="155" y="250" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#475569">ACK / REPORT_RESULT</text>

  <path d="M250 232 L330 232" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="290" y="216" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">submit</text>

  <rect x="345" y="150" width="245" height="164" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="468" y="190" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">Bounded worker</text>
  <text x="468" y="222" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#334155">1 JDBC worker</text>
  <text x="468" y="250" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#334155">ArrayBlockingQueue</text>
  <text x="468" y="278" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#334155">AbortPolicy signal</text>

  <path d="M590 190 L750 190" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="670" y="174" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#166534">capacity available</text>
  <rect x="770" y="146" width="190" height="88" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="865" y="181" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#166534">ACCEPTED</text>
  <text x="865" y="207" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#475569">persist outside I/O</text>

  <path d="M468 314 L468 382" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="486" y="351" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#92400e">saturated</text>
  <rect x="345" y="398" width="245" height="148" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="468" y="436" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#92400e">Bounded retry area</text>
  <text x="468" y="468" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#334155">Semaphore retry slots</text>
  <text x="468" y="496" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#334155">finite delay + attempts</text>
  <text x="468" y="524" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#334155">scheduler thread only</text>

  <path d="M590 438 C690 438 675 270 750 270" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="770" y="250" width="190" height="88" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="865" y="285" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#92400e">RETRYING</text>
  <text x="865" y="311" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#475569">auto-read may pause</text>

  <path d="M590 510 L750 510" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="670" y="494" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#991b1b">closed / slots full / exhausted</text>
  <rect x="770" y="466" width="190" height="88" rx="6" fill="#fef2f2" stroke="#dc5a47" stroke-width="2"/>
  <text x="865" y="501" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#991b1b">REJECTED</text>
  <text x="865" y="527" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#475569">observable terminal path</text>

  <path d="M770 294 C680 294 700 596 540 596 C380 596 468 546 468 546" fill="none" stroke="#168a8a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="642" y="620" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#116466">delay expires: retry worker submission without blocking EventLoop</text>
</svg>
